name: Build Aeria launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
            mkdir -p $(dirname app/build.gradle.kts)
            cat > app/build.gradle.kts <<'EOF_0'
            plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
            android {
                namespace = "com.aeria.launcher"
                compileSdk = 34
                defaultConfig { applicationId = "com.aeria.launcher"; minSdk = 22; targetSdk = 34; versionCode = 1; versionName = "1.0" }
                compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
                kotlinOptions { jvmTarget = "17" }
            }
            EOF_0
            mkdir -p $(dirname app/src/main/AndroidManifest.xml)
            cat > app/src/main/AndroidManifest.xml <<'EOF_1'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-feature android:name="android.software.leanback" android:required="false" />
                <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
                <queries>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" /></intent>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                </queries>
                <application android:label="Aeria" android:icon="@drawable/icon" android:banner="@drawable/banner"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.HOME" />
                            <category android:name="android.intent.category.DEFAULT" />
                        </intent-filter>
                    </activity>
                    <activity android:name=".InputActivity" android:exported="false" />
                </application>
            </manifest>
            EOF_1
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/InputActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/InputActivity.kt <<'EOF_2'
            package com.aeria.launcher

            import android.app.Activity
            import android.media.tv.TvContract
            import android.media.tv.TvView
            import android.os.Bundle

            class InputActivity : Activity() {
                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val tv = TvView(this)
                    setContentView(tv)
                    val id = intent.getStringExtra("id") ?: return finish()
                    tv.tune(id, TvContract.buildChannelUriForPassthroughInput(id))
                }
            }
            EOF_2
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/MainActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/MainActivity.kt <<'EOF_3'
            package com.aeria.launcher

            import android.app.Activity
            import android.content.Context
            import android.content.Intent
            import android.graphics.Color
            import android.graphics.Outline
            import android.graphics.Typeface
            import android.graphics.drawable.Drawable
            import android.graphics.drawable.GradientDrawable
            import android.media.tv.TvInputManager
            import android.os.Bundle
            import android.view.Gravity
            import android.view.View
            import android.view.ViewOutlineProvider
            import android.view.animation.DecelerateInterpolator
            import android.widget.*

            class MainActivity : Activity() {
                private class Item(val title: String, val sub: String, val art: Drawable?, val wide: Boolean, val go: () -> Unit)

                private val bg = 0xFF141414.toInt()
                private val red = 0xFFE50914.toInt()
                private lateinit var heroTitle: TextView
                private lateinit var heroSub: TextView
                private lateinit var heroArt: ImageView
                private lateinit var rows: LinearLayout
                private var firstTile: View? = null
                private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
                private fun font(w: String) = Typeface.create(w, Typeface.NORMAL)

                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bg) }
                    val hero = FrameLayout(this)
                    heroArt = ImageView(this)
                    hero.addView(heroArt, FrameLayout.LayoutParams(dp(560), -1, Gravity.END))
                    hero.addView(View(this).apply {
                        background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(bg, bg, 0x00141414))
                    }, FrameLayout.LayoutParams(-1, -1))
                    hero.addView(View(this).apply {
                        background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(0x00141414, bg))
                    }, FrameLayout.LayoutParams(-1, dp(70), Gravity.BOTTOM))
                    hero.addView(TextView(this).apply {
                        text = "Aeria"; textSize = 26f; setTextColor(red); typeface = font("sans-serif-black"); letterSpacing = 0.04f
                    }, FrameLayout.LayoutParams(-2, -2).apply { leftMargin = dp(56); topMargin = dp(28) })
                    hero.addView(TextClock(this).apply {
                        format12Hour = "h:mm"; format24Hour = "H:mm"; textSize = 26f
                        setTextColor(0xCCFFFFFF.toInt()); typeface = font("sans-serif-light")
                    }, FrameLayout.LayoutParams(-2, -2, Gravity.END).apply { rightMargin = dp(56); topMargin = dp(28) })
                    heroTitle = TextView(this).apply { textSize = 46f; setTextColor(Color.WHITE); typeface = font("sans-serif-medium"); maxLines = 2 }
                    heroSub = TextView(this).apply { textSize = 18f; setTextColor(0xB3FFFFFF.toInt()); typeface = font("sans-serif-light") }
                    val pill = TextView(this).apply {
                        text = "Press OK to open"; textSize = 15f; setTextColor(Color.WHITE); typeface = font("sans-serif-medium")
                        setPadding(dp(18), dp(8), dp(18), dp(8))
                        background = GradientDrawable().apply { cornerRadius = dp(8).toFloat(); setColor(red) }
                    }
                    hero.addView(LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL; gravity = Gravity.BOTTOM; setPadding(dp(56), 0, dp(300), dp(20))
                        addView(heroTitle); addView(heroSub)
                        addView(pill, LinearLayout.LayoutParams(-2, -2).apply { topMargin = dp(14) })
                    }, FrameLayout.LayoutParams(-1, -1))
                    root.addView(hero, LinearLayout.LayoutParams(-1, dp(250)))
                    rows = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; clipChildren = false; clipToPadding = false; setPadding(0, 0, 0, dp(40)) }
                    root.addView(ScrollView(this).apply { isVerticalScrollBarEnabled = false; clipChildren = false; addView(rows) }, LinearLayout.LayoutParams(-1, 0, 1f))
                    setContentView(root)
                }

                override fun onResume() {
                    super.onResume()
                    rows.removeAllViews()
                    firstTile = null
                    val pm = packageManager
                    val apps = listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)
                        .flatMap { pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(it), 0) }
                        .distinctBy { it.activityInfo.packageName }
                        .filter { it.activityInfo.packageName != packageName }
                        .sortedBy { it.loadLabel(pm).toString().lowercase() }
                        .map { r ->
                            val banner = r.activityInfo.loadBanner(pm)
                            Item(r.loadLabel(pm).toString(), "Open app", banner ?: r.loadIcon(pm), banner != null) {
                                pm.getLaunchIntentForPackage(r.activityInfo.packageName)?.let { startActivity(it) }
                            }
                        }
                    val tvm = getSystemService(Context.TV_INPUT_SERVICE) as TvInputManager
                    val inputs = tvm.tvInputList.filter { it.isPassthroughInput }.map { i ->
                        Item(i.loadLabel(this).toString(), "Switch input", null, false) {
                            startActivity(Intent(this, InputActivity::class.java).putExtra("id", i.id))
                        }
                    }
                    val settings = listOf(
                        "Settings" to "android.settings.SETTINGS", "Wi-Fi" to "android.settings.WIFI_SETTINGS",
                        "Display" to "android.settings.DISPLAY_SETTINGS", "Sound" to "android.settings.SOUND_SETTINGS",
                        "Bluetooth" to "android.settings.BLUETOOTH_SETTINGS", "Date and time" to "android.settings.DATE_SETTINGS"
                    ).map { (name, action) ->
                        Item(name, "Open settings", null, false) {
                            try { startActivity(Intent(action)) } catch (e: Exception) {
                                Toast.makeText(this, "$name isn't available on this TV", Toast.LENGTH_SHORT).show()
                            }
                        }
                    }
                    val per = maxOf(3, ((resources.displayMetrics.widthPixels / resources.displayMetrics.density - 112) / 206).toInt())
                    apps.chunked(per).forEachIndexed { i, c -> addRow(if (i == 0) "Apps" else "", c) }; addRow("Inputs", inputs); addRow("Settings", settings)
                    firstTile?.requestFocus()
                }

                private fun addRow(name: String, items: List<Item>) {
                    if (items.isEmpty()) return
                    if (name.isNotEmpty()) rows.addView(TextView(this).apply {
                        text = name; textSize = 20f; setTextColor(0xE6FFFFFF.toInt()); typeface = font("sans-serif-medium")
                        setPadding(dp(56), dp(10), 0, dp(6))
                    })
                    val line = LinearLayout(this).apply { clipChildren = false; setPadding(dp(56), dp(10), dp(56), dp(14)) }
                    items.forEach { line.addView(tile(it)) }
                    if (firstTile == null) firstTile = line.getChildAt(0)
                    rows.addView(HorizontalScrollView(this).apply {
                        isHorizontalScrollBarEnabled = false; clipChildren = false; clipToPadding = false; addView(line)
                    })
                }

                private fun tile(item: Item): View {
                    val radius = dp(12).toFloat()
                    val ring = GradientDrawable().apply { cornerRadius = radius; setStroke(dp(3), Color.WHITE); setColor(Color.TRANSPARENT) }
                    return FrameLayout(this).apply {
                        background = GradientDrawable().apply { cornerRadius = radius; setColor(0xFF2B2B2B.toInt()) }
                        outlineProvider = object : ViewOutlineProvider() {
                            override fun getOutline(v: View, o: Outline) = o.setRoundRect(0, 0, v.width, v.height, radius)
                        }
                        clipToOutline = true; isFocusable = true
                        if (item.art != null) addView(ImageView(context).apply {
                            setImageDrawable(item.art)
                            scaleType = if (item.wide) ImageView.ScaleType.CENTER_CROP else ImageView.ScaleType.FIT_CENTER
                            if (!item.wide) setPadding(dp(40), dp(20), dp(40), dp(20))
                        }, FrameLayout.LayoutParams(-1, -1))
                        else addView(TextView(context).apply {
                            text = item.title; textSize = 20f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; typeface = font("sans-serif-light")
                        }, FrameLayout.LayoutParams(-1, -1))
                        layoutParams = LinearLayout.LayoutParams(dp(190), dp(107)).apply { marginEnd = dp(16) }
                        setOnClickListener { item.go() }
                        setOnFocusChangeListener { v, f ->
                            foreground = if (f) ring else null
                            val s = if (f) 1.08f else 1f
                            v.animate().scaleX(s).scaleY(s).setDuration(180).setInterpolator(DecelerateInterpolator()).start()
                            if (f) show(item)
                        }
                    }
                }

                private fun show(item: Item) {
                    heroTitle.text = item.title; heroSub.text = item.sub
                    heroArt.setImageDrawable(item.art)
                    heroArt.scaleType = if (item.wide) ImageView.ScaleType.CENTER_CROP else ImageView.ScaleType.FIT_CENTER
                    heroArt.setPadding(if (item.wide) 0 else dp(120), 0, if (item.wide) 0 else dp(120), 0)
                    heroArt.alpha = 0f; heroArt.animate().alpha(0.95f).setDuration(300).start()
                }

                @Deprecated("Launcher stays on Home")
                override fun onBackPressed() {}
            }
            EOF_3
            mkdir -p $(dirname app/src/main/res/drawable/banner.xml)
            cat > app/src/main/res/drawable/banner.xml <<'EOF_4'
            <?xml version="1.0" encoding="utf-8"?>
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180">
                <path android:fillColor="#141414" android:pathData="M0,0h320v180h-320z" />
                <group android:pivotX="54" android:pivotY="54" android:scaleX="1.5" android:scaleY="1.5" android:translateX="106" android:translateY="36">
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:fillColor="#00000000" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M54,14 L30,90 M54,14 L78,90 M26,66 L82,66" />
                </group>
            </vector>
            EOF_4
            mkdir -p $(dirname app/src/main/res/drawable/icon.xml)
            cat > app/src/main/res/drawable/icon.xml <<'EOF_5'
            <?xml version="1.0" encoding="utf-8"?>
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                <path android:fillColor="#141414" android:pathData="M0,0h108v108h-108z" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:fillColor="#00000000" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M54,14 L30,90 M54,14 L78,90 M26,66 L82,66" />
            </vector>
            EOF_5
            mkdir -p $(dirname build.gradle.kts)
            cat > build.gradle.kts <<'EOF_6'
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            EOF_6
            mkdir -p $(dirname settings.gradle.kts)
            cat > settings.gradle.kts <<'EOF_7'
            pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
            dependencyResolutionManagement { repositories { google(); mavenCentral() } }
            rootProject.name = "Aeria"
            include(":app")
            EOF_7
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: app/build/outputs/apk/debug/app-debug.apk
