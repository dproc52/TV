name: Build Aeria launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
            mkdir -p $(dirname app/build.gradle.kts)
            cat > app/build.gradle.kts <<'EOF_0'
            plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
            android {
                namespace = "com.aeria.launcher"
                compileSdk = 34
                defaultConfig { applicationId = "com.aeria.launcher"; minSdk = 22; targetSdk = 34; versionCode = 1; versionName = "1.0" }
                compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
                kotlinOptions { jvmTarget = "17" }
            }
            EOF_0
            mkdir -p $(dirname app/src/main/AndroidManifest.xml)
            cat > app/src/main/AndroidManifest.xml <<'EOF_1'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-feature android:name="android.software.leanback" android:required="false" />
                <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
                <queries>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" /></intent>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                </queries>
                <application android:label="Aeria" android:icon="@drawable/icon" android:banner="@drawable/banner"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.HOME" />
                            <category android:name="android.intent.category.DEFAULT" />
                        </intent-filter>
                    </activity>
                    <activity android:name=".InputActivity" android:exported="false" />
                </application>
            </manifest>
            EOF_1
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/InputActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/InputActivity.kt <<'EOF_2'
            package com.aeria.launcher

            import android.app.Activity
            import android.media.tv.TvContract
            import android.media.tv.TvView
            import android.os.Bundle

            class InputActivity : Activity() {
                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val tv = TvView(this)
                    setContentView(tv)
                    val id = intent.getStringExtra("id") ?: return finish()
                    tv.tune(id, TvContract.buildChannelUriForPassthroughInput(id))
                }
            }
            EOF_2
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/MainActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/MainActivity.kt <<'EOF_3'
            package com.aeria.launcher

            import android.app.Activity
            import android.content.Context
            import android.content.Intent
            import android.content.pm.ResolveInfo
            import android.graphics.Canvas
            import android.graphics.Color
            import android.graphics.Outline
            import android.graphics.Paint
            import android.graphics.RectF
            import android.graphics.Typeface
            import android.graphics.drawable.Drawable
            import android.graphics.drawable.GradientDrawable
            import android.media.tv.TvInputManager
            import android.os.Bundle
            import android.view.Gravity
            import android.view.View
            import android.view.ViewOutlineProvider
            import android.view.animation.DecelerateInterpolator
            import android.widget.*

            class MainActivity : Activity() {
                private class Item(val title: String, val art: Drawable?, val wide: Boolean, val go: () -> Unit)

                private lateinit var rows: LinearLayout
                private var firstTile: View? = null
                private val prefs by lazy { getSharedPreferences("aeria", MODE_PRIVATE) }
                private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
                private fun font(w: String) = Typeface.create(w, Typeface.NORMAL)

                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val root = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        background = GradientDrawable(
                            GradientDrawable.Orientation.TOP_BOTTOM,
                            intArrayOf(0xFF0E1A3D.toInt(), 0xFF070B1A.toInt(), 0xFF03050C.toInt())
                        )
                    }
                    val bar = FrameLayout(this)
                    bar.addView(TextView(this).apply {
                        text = "Home"; textSize = 22f; setTextColor(Color.WHITE); typeface = font("sans-serif-medium")
                    }, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER_VERTICAL).apply { leftMargin = dp(60) })
                    val right = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                    right.addView(TextClock(this).apply {
                        format12Hour = "h:mm"; format24Hour = "H:mm"; textSize = 20f
                        setTextColor(0xE6FFFFFF.toInt()); typeface = font("sans-serif-light")
                    })
                    right.addView(IconView(false), LinearLayout.LayoutParams(dp(28), dp(28)).apply { marginStart = dp(18) })
                    right.addView(IconView(true).apply {
                        isFocusable = true
                        setOnClickListener { open("android.settings.SETTINGS", "Settings") }
                        setOnFocusChangeListener { v, f ->
                            v.background = if (f) GradientDrawable().apply { shape = GradientDrawable.OVAL; setStroke(dp(2), Color.WHITE) } else null
                            v.invalidate()
                        }
                    }, LinearLayout.LayoutParams(dp(36), dp(36)).apply { marginStart = dp(14) })
                    bar.addView(right, FrameLayout.LayoutParams(-2, -2, Gravity.END or Gravity.CENTER_VERTICAL).apply { rightMargin = dp(52) })
                    root.addView(bar, LinearLayout.LayoutParams(-1, dp(64)))
                    rows = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; clipChildren = false; clipToPadding = false; setPadding(0, 0, 0, dp(40)) }
                    root.addView(ScrollView(this).apply { isVerticalScrollBarEnabled = false; clipChildren = false; addView(rows) }, LinearLayout.LayoutParams(-1, 0, 1f))
                    setContentView(root)
                }

                override fun onResume() {
                    super.onResume()
                    rows.removeAllViews(); firstTile = null
                    val pm = packageManager
                    val infos = listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)
                        .flatMap { pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(it), 0) }
                        .distinctBy { it.activityInfo.packageName }
                        .filter { it.activityInfo.packageName != packageName }
                        .sortedBy { it.loadLabel(pm).toString().lowercase() }
                    val byPkg = infos.associate { it.activityInfo.packageName to appItem(it) }
                    val keys = listOf("netflix", "youtube", "disney", "avod", "apple", "wbd", "max", "spotify", "hulu", "plex")
                    fun rank(p: String) = keys.indexOfFirst { p.contains(it) }.let { if (it < 0) 99 else it }
                    val recent = prefs.getString("recent", "")!!.split(",").filter { byPkg.containsKey(it) }
                    val fav = (recent + infos.map { it.activityInfo.packageName }.sortedBy { rank(it) })
                        .distinct().take(6).mapNotNull { byPkg[it] }
                    val tvm = getSystemService(Context.TV_INPUT_SERVICE) as TvInputManager
                    val inputs = tvm.tvInputList.filter { it.isPassthroughInput }.map { i ->
                        Item(i.loadLabel(this).toString(), null, false) {
                            startActivity(Intent(this, InputActivity::class.java).putExtra("id", i.id))
                        }
                    }
                    val settings = listOf(
                        "Wi-Fi" to "android.settings.WIFI_SETTINGS", "Display" to "android.settings.DISPLAY_SETTINGS",
                        "Sound" to "android.settings.SOUND_SETTINGS", "Bluetooth" to "android.settings.BLUETOOTH_SETTINGS",
                        "Date and time" to "android.settings.DATE_SETTINGS"
                    ).map { (name, action) -> Item(name, null, false) { open(action, name) } }
                    val allApps = infos.map { byPkg[it.activityInfo.packageName]!! } + Item("Settings", null, false) { open("android.settings.SETTINGS", "Settings") }
                    addRow("", fav, 136, 100)
                    addRow("Inputs", inputs, 180, 100)
                    val per = maxOf(4, ((resources.displayMetrics.widthPixels / resources.displayMetrics.density - 120) / 126).toInt())
                    allApps.chunked(per).forEachIndexed { i, c -> addRow(if (i == 0) "Apps" else "", c, 112, 80) }
                    addRow("Settings", settings, 150, 70)
                    firstTile?.requestFocus()
                }

                private fun appItem(r: ResolveInfo): Item {
                    val pm = packageManager
                    val banner = r.activityInfo.loadBanner(pm)
                    return Item(r.loadLabel(pm).toString(), banner ?: r.loadIcon(pm), banner != null) { launch(r.activityInfo.packageName) }
                }

                private fun launch(pkg: String) {
                    val recent = (listOf(pkg) + prefs.getString("recent", "")!!.split(",").filter { it.isNotEmpty() && it != pkg }).take(6)
                    prefs.edit().putString("recent", recent.joinToString(",")).apply()
                    packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                }

                private fun open(action: String, name: String) {
                    try { startActivity(Intent(action)) } catch (e: Exception) {
                        Toast.makeText(this, "$name isn't available on this TV", Toast.LENGTH_SHORT).show()
                    }
                }

                private fun addRow(name: String, items: List<Item>, w: Int, h: Int) {
                    if (items.isEmpty()) return
                    if (name.isNotEmpty()) rows.addView(TextView(this).apply {
                        text = name; textSize = 16f; setTextColor(0xD9FFFFFF.toInt()); typeface = font("sans-serif-medium")
                        setPadding(dp(60), dp(8), 0, dp(2))
                    })
                    val line = LinearLayout(this).apply { clipChildren = false; setPadding(dp(60), dp(8), dp(60), dp(10)) }
                    items.forEach { line.addView(tile(it, w, h)) }
                    if (firstTile == null) firstTile = line.getChildAt(0)
                    rows.addView(HorizontalScrollView(this).apply {
                        isHorizontalScrollBarEnabled = false; clipChildren = false; clipToPadding = false; addView(line)
                    })
                }

                private fun tile(item: Item, w: Int, h: Int): View {
                    val radius = dp(14).toFloat()
                    val ring = GradientDrawable().apply { cornerRadius = radius; setStroke(dp(3), Color.WHITE); setColor(Color.TRANSPARENT) }
                    var label: TextView? = null
                    return FrameLayout(this).apply {
                        background = GradientDrawable().apply { cornerRadius = radius; setColor(0x2EFFFFFF) }
                        outlineProvider = object : ViewOutlineProvider() {
                            override fun getOutline(v: View, o: Outline) = o.setRoundRect(0, 0, v.width, v.height, radius)
                        }
                        clipToOutline = true; isFocusable = true
                        if (item.art != null) {
                            addView(ImageView(context).apply {
                                setImageDrawable(item.art)
                                scaleType = if (item.wide) ImageView.ScaleType.CENTER_CROP else ImageView.ScaleType.FIT_CENTER
                                if (!item.wide) setPadding(dp(28), dp(18), dp(28), dp(18))
                            }, FrameLayout.LayoutParams(-1, -1))
                            val lb = TextView(context).apply {
                                text = item.title; textSize = 12f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                                alpha = 0f; setShadowLayer(4f, 0f, 1f, Color.BLACK); setPadding(0, 0, 0, dp(6))
                            }
                            label = lb
                            addView(lb, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                        } else addView(TextView(context).apply {
                            text = item.title; textSize = 16f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; typeface = font("sans-serif-light")
                        }, FrameLayout.LayoutParams(-1, -1))
                        layoutParams = LinearLayout.LayoutParams(dp(w), dp(h)).apply { marginEnd = dp(14) }
                        setOnClickListener { item.go() }
                        setOnFocusChangeListener { v, f ->
                            foreground = if (f) ring else null
                            val s = if (f) 1.08f else 1f
                            v.animate().scaleX(s).scaleY(s).setDuration(180).setInterpolator(DecelerateInterpolator()).start()
                            label?.alpha = if (f) 1f else 0f
                        }
                    }
                }

                private inner class IconView(private val gear: Boolean) : View(this@MainActivity) {
                    private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.STROKE; strokeWidth = dp(2).toFloat(); strokeCap = Paint.Cap.ROUND
                    }
                    override fun onDraw(c: Canvas) {
                        p.color = if (isFocused) Color.WHITE else 0xCCFFFFFF.toInt()
                        val cx = width / 2f; val cy = height / 2f; val r = minOf(width, height) / 2f - dp(5)
                        if (gear) {
                            c.drawCircle(cx, cy, r * 0.5f, p); c.drawCircle(cx, cy, r * 0.2f, p)
                            for (i in 0 until 8) {
                                val a = Math.toRadians(i * 45.0); val dx = Math.cos(a).toFloat(); val dy = Math.sin(a).toFloat()
                                c.drawLine(cx + dx * r * 0.65f, cy + dy * r * 0.65f, cx + dx * r, cy + dy * r, p)
                            }
                        } else {
                            val base = cy + r * 0.5f
                            for (k in 1..3) {
                                val rr = r * k / 3f
                                c.drawArc(RectF(cx - rr, base - rr, cx + rr, base + rr), 225f, 90f, false, p)
                            }
                            p.style = Paint.Style.FILL; c.drawCircle(cx, base, dp(2).toFloat(), p); p.style = Paint.Style.STROKE
                        }
                    }
                }

                @Deprecated("Launcher stays on Home")
                override fun onBackPressed() {}
            }
            EOF_3
            mkdir -p $(dirname app/src/main/res/drawable/banner.xml)
            cat > app/src/main/res/drawable/banner.xml <<'EOF_4'
            <?xml version="1.0" encoding="utf-8"?>
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180">
                <path android:fillColor="#141414" android:pathData="M0,0h320v180h-320z" />
                <group android:pivotX="54" android:pivotY="54" android:scaleX="1.5" android:scaleY="1.5" android:translateX="106" android:translateY="36">
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:fillColor="#00000000" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M54,14 L30,90 M54,14 L78,90 M26,66 L82,66" />
                </group>
            </vector>
            EOF_4
            mkdir -p $(dirname app/src/main/res/drawable/icon.xml)
            cat > app/src/main/res/drawable/icon.xml <<'EOF_5'
            <?xml version="1.0" encoding="utf-8"?>
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
                <path android:fillColor="#141414" android:pathData="M0,0h108v108h-108z" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:fillColor="#00000000" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0" />
                <path android:strokeColor="#E50914" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M54,14 L30,90 M54,14 L78,90 M26,66 L82,66" />
            </vector>
            EOF_5
            mkdir -p $(dirname build.gradle.kts)
            cat > build.gradle.kts <<'EOF_6'
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            EOF_6
            mkdir -p $(dirname settings.gradle.kts)
            cat > settings.gradle.kts <<'EOF_7'
            pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
            dependencyResolutionManagement { repositories { google(); mavenCentral() } }
            rootProject.name = "Aeria"
            include(":app")
            EOF_7
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: app/build/outputs/apk/debug/app-debug.apk
