name: Build Aeria launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
            mkdir -p $(dirname app/build.gradle.kts)
            cat > app/build.gradle.kts <<'EOF_0'
            plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
            android {
                namespace = "com.aeria.launcher"
                compileSdk = 34
                defaultConfig { applicationId = "com.aeria.launcher"; minSdk = 22; targetSdk = 28; versionCode = 1; versionName = "1.0" }
                compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
                kotlinOptions { jvmTarget = "17" }
            }
            EOF_0
            mkdir -p $(dirname app/src/main/AndroidManifest.xml)
            cat > app/src/main/AndroidManifest.xml <<'EOF_1'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.READ_LOGS" />
                <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
                <uses-feature android:name="android.software.leanback" android:required="false" />
                <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
                <queries>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" /></intent>
                    <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                </queries>
                <application android:label="Aeria" android:icon="@drawable/icon" android:banner="@drawable/banner"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.HOME" />
                            <category android:name="android.intent.category.DEFAULT" />
                        </intent-filter>
                    </activity>
                    <service android:name=".HomeKeyService" android:exported="false" />
                    <receiver android:name=".BootReceiver" android:exported="true">
                        <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                    </receiver>
                    <activity android:name=".InputActivity" android:exported="false" />
                </application>
            </manifest>
            EOF_1
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/BootReceiver.kt)
            cat > app/src/main/java/com/aeria/launcher/BootReceiver.kt <<'EOF_2'
            package com.aeria.launcher

            import android.content.BroadcastReceiver
            import android.content.Context
            import android.content.Intent
            import android.os.Build

            class BootReceiver : BroadcastReceiver() {
                override fun onReceive(c: Context, i: Intent) {
                    val s = Intent(c, HomeKeyService::class.java)
                    if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s) else c.startService(s)
                }
            }
            EOF_2
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/HomeKeyService.kt)
            cat > app/src/main/java/com/aeria/launcher/HomeKeyService.kt <<'EOF_3'
            package com.aeria.launcher

            import android.app.Notification
            import android.app.NotificationChannel
            import android.app.NotificationManager
            import android.app.Service
            import android.content.Context
            import android.content.Intent
            import android.os.Build
            import android.os.IBinder
            import java.net.InetSocketAddress
            import java.net.Socket

            class HomeKeyService : Service() {
                private var worker: Thread? = null

                override fun onBind(i: Intent?): IBinder? = null

                override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                    startForeground(1, notification())
                    if (worker == null) worker = Thread { watch() }.also { it.isDaemon = true; it.start() }
                    return START_STICKY
                }

                private fun notification(): Notification {
                    val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                    return if (Build.VERSION.SDK_INT >= 26) {
                        nm.createNotificationChannel(NotificationChannel("aeria", "Aeria", NotificationManager.IMPORTANCE_MIN))
                        Notification.Builder(this, "aeria").setSmallIcon(R.drawable.icon).setContentTitle("Aeria Home").build()
                    } else {
                        Notification.Builder(this).setSmallIcon(R.drawable.icon).setContentTitle("Aeria Home").build()
                    }
                }

                private fun watch() {
                    var last = 0L
                    while (true) {
                        try {
                            val p = Runtime.getRuntime().exec(arrayOf("logcat", "-b", "system", "-b", "events", "-v", "brief", "-T", "1"))
                            p.inputStream.bufferedReader().forEachLine { l ->
                                val hit = l.contains("handleShortPressOnHome") ||
                                    (l.contains("am_focused_activity") && l.contains("com.amazon.tv.launcher"))
                                val now = System.currentTimeMillis()
                                if (hit && now - last > 600) { last = now; goHome() }
                            }
                        } catch (e: Exception) {}
                        try { Thread.sleep(3000) } catch (e: InterruptedException) {}
                    }
                }

                private fun goHome() {
                    try {
                        Socket().use { s ->
                            s.connect(InetSocketAddress("127.0.0.1", 38275), 150)
                            s.getOutputStream().write("home\n".toByteArray())
                            s.getOutputStream().flush()
                        }
                        return
                    } catch (e: Exception) {}
                    startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP))
                }
            }
            EOF_3
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/InputActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/InputActivity.kt <<'EOF_4'
            package com.aeria.launcher

            import android.app.Activity
            import android.media.tv.TvContract
            import android.media.tv.TvView
            import android.os.Bundle

            class InputActivity : Activity() {
                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val tv = TvView(this)
                    setContentView(tv)
                    val id = intent.getStringExtra("id") ?: return finish()
                    tv.tune(id, TvContract.buildChannelUriForPassthroughInput(id))
                }
            }
            EOF_4
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/MainActivity.kt)
            cat > app/src/main/java/com/aeria/launcher/MainActivity.kt <<'EOF_5'
            package com.aeria.launcher

            import android.app.Activity
            import android.content.Context
            import android.content.Intent
            import android.content.pm.ResolveInfo
            import android.graphics.Canvas
            import android.graphics.Color
            import android.graphics.Outline
            import android.graphics.Paint
            import android.graphics.RectF
            import android.graphics.Typeface
            import android.graphics.drawable.Drawable
            import android.graphics.drawable.GradientDrawable
            import android.media.tv.TvInputManager
            import android.os.Bundle
            import android.view.Gravity
            import android.view.View
            import android.view.ViewOutlineProvider
            import android.view.animation.DecelerateInterpolator
            import android.widget.*

            // PlayStation-style home: tabs on top, big square tiles that lift and light up when focused.
            class MainActivity : Activity() {
                private class Item(val title: String, val art: Drawable?, val go: () -> Unit)

                private lateinit var rows: LinearLayout
                private lateinit var tabs: List<TextView>
                private var tab = 0
                private var byPkg: Map<String, Item> = emptyMap()
                private var firstTile: View? = null
                private val prefs by lazy { getSharedPreferences("aeria", MODE_PRIVATE) }
                private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
                private fun font(w: String) = Typeface.create(w, Typeface.NORMAL)

                override fun onCreate(b: Bundle?) {
                    super.onCreate(b)
                    val root = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        background = GradientDrawable(
                            GradientDrawable.Orientation.TL_BR,
                            intArrayOf(0xFF0B2A6B.toInt(), 0xFF060D26.toInt(), 0xFF020410.toInt())
                        )
                    }
                    val bar = FrameLayout(this)
                    tabs = listOf("Home", "Inputs", "Settings").mapIndexed { i, n ->
                        TextView(this).apply {
                            text = n; textSize = 20f; isFocusable = true
                            setPadding(dp(18), dp(8), dp(18), dp(8))
                            setOnClickListener { select(i) }
                            setOnFocusChangeListener { v, f ->
                                v.background = if (f) GradientDrawable().apply { cornerRadius = dp(30).toFloat(); setColor(0x33FFFFFF) } else null
                                if (f) select(i)
                            }
                        }
                    }
                    val left = LinearLayout(this)
                    tabs.forEach { left.addView(it, LinearLayout.LayoutParams(-2, -2).apply { marginEnd = dp(8) }) }
                    bar.addView(left, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER_VERTICAL).apply { leftMargin = dp(42) })
                    val right = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                    right.addView(TextClock(this).apply {
                        format12Hour = "h:mm"; format24Hour = "H:mm"; textSize = 20f
                        setTextColor(0xE6FFFFFF.toInt()); typeface = font("sans-serif-light")
                    })
                    right.addView(IconView(false), LinearLayout.LayoutParams(dp(28), dp(28)).apply { marginStart = dp(18) })
                    right.addView(IconView(true).apply {
                        isFocusable = true
                        setOnClickListener { open("android.settings.SETTINGS", "Settings") }
                        setOnFocusChangeListener { v, f ->
                            v.background = if (f) GradientDrawable().apply { shape = GradientDrawable.OVAL; setStroke(dp(2), Color.WHITE) } else null
                            v.invalidate()
                        }
                    }, LinearLayout.LayoutParams(dp(36), dp(36)).apply { marginStart = dp(14) })
                    bar.addView(right, FrameLayout.LayoutParams(-2, -2, Gravity.END or Gravity.CENTER_VERTICAL).apply { rightMargin = dp(52) })
                    root.addView(bar, LinearLayout.LayoutParams(-1, dp(68)))
                    rows = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; clipChildren = false; clipToPadding = false; setPadding(0, 0, 0, dp(40)) }
                    root.addView(ScrollView(this).apply { isVerticalScrollBarEnabled = false; clipChildren = false; addView(rows) }, LinearLayout.LayoutParams(-1, 0, 1f))
                    setContentView(root)
                    val svc = Intent(this, HomeKeyService::class.java)
                    if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                }

                override fun onResume() {
                    super.onResume()
                    val pm = packageManager
                    byPkg = listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)
                        .flatMap { pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(it), 0) }
                        .distinctBy { it.activityInfo.packageName }
                        .filter { it.activityInfo.packageName != packageName }
                        .sortedBy { it.loadLabel(pm).toString().lowercase() }
                        .associate { it.activityInfo.packageName to appItem(it) }
                    render()
                    (firstTile ?: tabs[tab]).requestFocus()
                }

                private fun select(i: Int) {
                    if (i == tab && rows.childCount > 0) return
                    tab = i
                    render()
                }

                private fun render() {
                    tabs.forEachIndexed { i, t ->
                        t.setTextColor(if (i == tab) Color.WHITE else 0x8CFFFFFF.toInt())
                        t.typeface = font(if (i == tab) "sans-serif-medium" else "sans-serif")
                    }
                    rows.removeAllViews(); firstTile = null
                    when (tab) {
                        0 -> {
                            val keys = listOf("netflix", "youtube", "disney", "avod", "apple", "wbd", "max", "spotify", "hulu", "plex")
                            fun rank(p: String) = keys.indexOfFirst { p.contains(it) }.let { if (it < 0) 99 else it }
                            val recent = prefs.getString("recent", "")!!.split(",").filter { byPkg.containsKey(it) }
                            val fav = (recent + byPkg.keys.sortedBy { rank(it) }).distinct().take(6).mapNotNull { byPkg[it] }
                            addRow("Recent", fav, 140)
                            val per = maxOf(4, ((resources.displayMetrics.widthPixels / resources.displayMetrics.density - 120) / 116).toInt())
                            byPkg.values.toList().chunked(per).forEachIndexed { i, c -> addRow(if (i == 0) "All apps" else "", c, 100) }
                        }
                        1 -> {
                            val tvm = getSystemService(Context.TV_INPUT_SERVICE) as TvInputManager
                            val inputs = tvm.tvInputList.filter { it.isPassthroughInput }.map { i ->
                                Item(i.loadLabel(this).toString(), null) {
                                    startActivity(Intent(this, InputActivity::class.java).putExtra("id", i.id))
                                }
                            }
                            if (inputs.isEmpty()) rows.addView(TextView(this).apply {
                                text = "No HDMI or AV inputs found"; textSize = 18f; setTextColor(0xB3FFFFFF.toInt()); setPadding(dp(60), dp(24), 0, 0)
                            })
                            addRow("Inputs", inputs, 140)
                        }
                        else -> {
                            val settings = listOf(
                                "All settings" to "android.settings.SETTINGS", "Wi-Fi" to "android.settings.WIFI_SETTINGS",
                                "Display" to "android.settings.DISPLAY_SETTINGS", "Sound" to "android.settings.SOUND_SETTINGS",
                                "Bluetooth" to "android.settings.BLUETOOTH_SETTINGS", "Date and time" to "android.settings.DATE_SETTINGS"
                            ).map { (name, action) -> Item(name, null) { open(action, name) } }
                            addRow("Settings", settings, 140)
                        }
                    }
                }

                private fun appItem(r: ResolveInfo): Item {
                    val pm = packageManager
                    return Item(r.loadLabel(pm).toString(), r.loadIcon(pm)) { launch(r.activityInfo.packageName) }
                }

                private fun launch(pkg: String) {
                    val recent = (listOf(pkg) + prefs.getString("recent", "")!!.split(",").filter { it.isNotEmpty() && it != pkg }).take(6)
                    prefs.edit().putString("recent", recent.joinToString(",")).apply()
                    packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                }

                private fun open(action: String, name: String) {
                    try { startActivity(Intent(action)) } catch (e: Exception) {
                        Toast.makeText(this, "$name isn't available on this TV", Toast.LENGTH_SHORT).show()
                    }
                }

                private fun addRow(name: String, items: List<Item>, size: Int) {
                    if (items.isEmpty()) return
                    if (name.isNotEmpty()) rows.addView(TextView(this).apply {
                        text = name; textSize = 16f; setTextColor(0xB3FFFFFF.toInt()); typeface = font("sans-serif-medium")
                        setPadding(dp(60), dp(12), 0, 0)
                    })
                    val line = LinearLayout(this).apply { clipChildren = false; setPadding(dp(60), dp(14), dp(60), dp(14)) }
                    items.forEach { line.addView(tile(it, size)) }
                    if (firstTile == null) firstTile = line.getChildAt(0)
                    rows.addView(HorizontalScrollView(this).apply {
                        isHorizontalScrollBarEnabled = false; clipChildren = false; clipToPadding = false; addView(line)
                    })
                }

                private fun tile(item: Item, size: Int): View {
                    val radius = dp(18).toFloat()
                    val ring = GradientDrawable().apply { cornerRadius = radius; setStroke(dp(3), Color.WHITE); setColor(Color.TRANSPARENT) }
                    val card = FrameLayout(this).apply {
                        background = GradientDrawable().apply { cornerRadius = radius; setColor(0x2EFFFFFF) }
                        outlineProvider = object : ViewOutlineProvider() {
                            override fun getOutline(v: View, o: Outline) = o.setRoundRect(0, 0, v.width, v.height, radius)
                        }
                        clipToOutline = true
                        if (item.art != null) addView(ImageView(context).apply {
                            setImageDrawable(item.art); scaleType = ImageView.ScaleType.FIT_CENTER
                            setPadding(dp(14), dp(14), dp(14), dp(14))
                        }, FrameLayout.LayoutParams(-1, -1))
                        else addView(TextView(context).apply {
                            text = item.title; textSize = 16f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; typeface = font("sans-serif-light")
                        }, FrameLayout.LayoutParams(-1, -1))
                    }
                    val label = TextView(this).apply {
                        text = item.title; textSize = 14f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                        maxLines = 1; alpha = 0f; typeface = font("sans-serif-medium"); setPadding(0, dp(8), 0, 0)
                    }
                    return LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL; isFocusable = true; clipChildren = false
                        addView(card, LinearLayout.LayoutParams(dp(size), dp(size)))
                        addView(label, LinearLayout.LayoutParams(dp(size), -2))
                        layoutParams = LinearLayout.LayoutParams(-2, -2).apply { marginEnd = dp(16) }
                        setOnClickListener { item.go() }
                        setOnFocusChangeListener { v, f ->
                            card.foreground = if (f) ring else null
                            val s = if (f) 1.12f else 1f
                            v.animate().scaleX(s).scaleY(s).setDuration(180).setInterpolator(DecelerateInterpolator()).start()
                            if (item.art != null) label.alpha = if (f) 1f else 0f
                        }
                    }
                }

                private inner class IconView(private val gear: Boolean) : View(this@MainActivity) {
                    private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.STROKE; strokeWidth = dp(2).toFloat(); strokeCap = Paint.Cap.ROUND
                    }
                    override fun onDraw(c: Canvas) {
                        p.color = if (isFocused) Color.WHITE else 0xCCFFFFFF.toInt()
                        val cx = width / 2f; val cy = height / 2f; val r = minOf(width, height) / 2f - dp(5)
                        if (gear) {
                            c.drawCircle(cx, cy, r * 0.5f, p); c.drawCircle(cx, cy, r * 0.2f, p)
                            for (i in 0 until 8) {
                                val a = Math.toRadians(i * 45.0); val dx = Math.cos(a).toFloat(); val dy = Math.sin(a).toFloat()
                                c.drawLine(cx + dx * r * 0.65f, cy + dy * r * 0.65f, cx + dx * r, cy + dy * r, p)
                            }
                        } else {
                            val base = cy + r * 0.5f
                            for (k in 1..3) {
                                val rr = r * k / 3f
                                c.drawArc(RectF(cx - rr, base - rr, cx + rr, base + rr), 225f, 90f, false, p)
                            }
                            p.style = Paint.Style.FILL; c.drawCircle(cx, base, dp(2).toFloat(), p); p.style = Paint.Style.STROKE
                        }
                    }
                }

                @Deprecated("Launcher stays on Home")
                override fun onBackPressed() {}
            }
            EOF_5
            mkdir -p $(dirname app/src/main/java/com/aeria/launcher/ShellHome.kt)
            cat > app/src/main/java/com/aeria/launcher/ShellHome.kt <<'EOF_6'
            package com.aeria.launcher

            import java.net.InetAddress
            import java.net.ServerSocket

            // Runs as the ADB shell user (started from a computer). Opens Aeria instantly when asked.
            object ShellHome {
                @JvmStatic
                fun main(args: Array<String>) {
                    val srv = ServerSocket(38275, 5, InetAddress.getByName("127.0.0.1"))
                    while (true) {
                        val s = srv.accept()
                        try {
                            val cmd = s.getInputStream().bufferedReader().readLine()
                            if (cmd == "home") {
                                Runtime.getRuntime().exec(arrayOf("am", "start", "-n", "com.aeria.launcher/.MainActivity", "-f", "0x14000000")).waitFor()
                            }
                        } catch (e: Exception) {
                        } finally {
                            s.close()
                        }
                    }
                }
            }
            EOF_6
            mkdir -p $(dirname app/src/main/res/drawable/banner.xml)
            cat > app/src/main/res/drawable/banner.xml <<'EOF_7'
